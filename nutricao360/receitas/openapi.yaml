openapi: 3.1.0
info:
  title: receitas API
  version: 1.0.0
  description: |
    **receitas** — Chat IA de receitas da Nutricao360.

    Sessões persistentes (`ChatSession` + `ChatMessage`) com RAG sobre itens da
    `KnowledgeBase` do tipo `recipe_reference`. A LLM responde em JSON estruturado
    de receita (ingredientes, modo de preparo, info nutricional). Acesso por
    e-mail validado em `UnifiedSubscriptionService` (Hotmart + Guru).

    - **Porta dev:** 3006
    - **Auth pública:** verificação de assinatura por e-mail
servers:
  - url: http://localhost:3006
    description: Desenvolvimento
  - url: https://receitas.nutricao360.com
    description: Produção
tags:
  - name: Meta
    description: Spec OpenAPI exposta pelo app.
  - name: Auth
    description: Verificação de e-mail/assinatura.
  - name: Chat
    description: Sessões e mensagens do assistente de receitas.
  - name: Webhooks
    description: Eventos da plataforma Guru.
paths:
  /api/swagger:
    get:
      tags: [Meta]
      summary: OpenAPI spec do app receitas
      responses:
        "200":
          description: Spec OpenAPI 3.1 em JSON.

  /api/auth/verify-email:
    get:
      tags: [Auth]
      summary: Valida assinatura e lista sessões recentes
      description: |
        Valida a assinatura no `UnifiedSubscriptionService` e devolve até 20
        sessões mais recentes do usuário.
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: Usuário e sessões.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasAccess: { type: boolean }
                  user: { $ref: "#/components/schemas/User" }
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/ChatSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/chat:
    post:
      tags: [Chat]
      summary: Envia mensagem ao assistente de receitas
      description: |
        Cria sessão se `sessionId` ausente. Recupera contexto via RAG
        (`recipe_reference`) e chama a LLM via OpenRouter. A resposta é
        persistida e devolvida (geralmente um JSON estruturado de receita).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, message]
              properties:
                email: { type: string, format: email }
                message: { type: string, minLength: 1 }
                sessionId: { type: string, nullable: true }
      responses:
        "200":
          description: Mensagem do assistente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  message: { $ref: "#/components/schemas/ChatMessage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/chat/{sessionId}:
    get:
      tags: [Chat]
      summary: Carrega sessão e histórico
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
        - in: query
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: Sessão e mensagens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/ChatSession" }
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/ChatMessage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Chat]
      summary: Exclui sessão (cascade messages)
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
        - in: query
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: Sessão excluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/webhook/guru:
    get:
      tags: [Webhooks]
      summary: Healthcheck do webhook Guru
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  productPeriods:
                    type: object
                    additionalProperties: { type: integer }
    post:
      tags: [Webhooks]
      summary: Evento de assinatura Guru
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuruWebhookPayload" }
      responses:
        "200": { $ref: "#/components/responses/WebhookOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  responses:
    BadRequest:
      description: Parâmetros inválidos.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: api_token inválido.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Assinatura inativa.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Erro interno.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WebhookOk:
      description: Evento aceito (processado ou ignorado).
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        email: { type: string, format: email }
    ChatSession:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChatMessage:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    GuruWebhookPayload:
      type: object
      required: [api_token]
      properties:
        api_token: { type: string }
        id: { type: string }
        event: { type: string }
        status: { type: string }
        contact:
          type: object
          properties:
            email: { type: string, format: email }
        product:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
