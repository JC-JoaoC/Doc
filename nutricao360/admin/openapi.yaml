      tags: [FirePay]
      summary: Importa usuários no FirePay (JSON ou CSV; +2 meses)
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  items:
                    type: object
                    properties:
                      email: { type: string, format: email }
                      name: { type: string }
                      phone: { type: string }
          text/csv:
            schema: { type: string }
      responses:
        "200": { description: Importação concluída. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/cron/process-scheduled:
    get:
      tags: [Cron]
      summary: Aprova SCHEDULED em background e envia e-mails/webhooks
      description: |
        Pode ser chamado com `Authorization: Bearer <CRON_SECRET>` (Vercel Cron)
        ou aberto (controlado por env).
      parameters:
        - in: header
          name: Authorization
          schema: { type: string, example: "Bearer ..." }
      responses:
        "200": { description: Execução concluída. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cron/process-webhooks:
    get:
      tags: [Cron]
      summary: Processa fila WebhookQueue (até 5 min)
      responses:
        "200": { description: Execução concluída. }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/webhook/form-submission:
    post:
      tags: [Webhooks]
      summary: Webhook principal Etapa 1 — cria plano/relatório/suplemento
      description: |
        Recebe a resposta do formulário CDA Etapa 1 e cria placeholders (MealPlan,
        Report e/ou Supplement). A análise via IA roda em background.
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [meal_plan, report, supplement]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormSubmissionPayload" }
      responses:
        "202": { description: Aceito; análise em background. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/webhook/form-submission-etapa2:
    post:
      tags: [Webhooks]
      summary: Webhook Etapa 2 (legado) — cria MealPlan placeholder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormSubmissionPayload" }
      responses:
        "202": { description: Aceito. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/webhook/etapa2/meal-plan:
    post:
      tags: [Webhooks]
      summary: Webhook Etapa 2 — cria MealPlan placeholder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormSubmissionPayload" }
      responses:
        "202": { description: Aceito. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/webhook/etapa2/report:
    post:
      tags: [Webhooks]
      summary: Webhook Etapa 2 — cria Report placeholder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormSubmissionPayload" }
      responses:
        "202": { description: Aceito. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/webhook/firepay:
    get:
      tags: [Webhooks]
      summary: Health-check FirePay
      responses:
        "200": { description: OK. }
    post:
      tags: [Webhooks]
      summary: Webhook FirePay (paid/refunded/canceled/chargeback)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status, product, client]
              properties:
                id: { type: string }
                status:
                  type: string
                  enum: [paid, refunded, canceled, chargeback]
                product:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                client:
                  type: object
                  properties:
                    email: { type: string, format: email }
                    name: { type: string }
      responses:
        "200": { description: Evento processado. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: next-auth.session-token
    externalApiKey:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    AnalysisStatusQuery:
      in: query
      name: status
      schema: { $ref: "#/components/schemas/AnalysisStatus" }
    StartDate:
      in: query
      name: startDate
      schema: { type: string, format: date }
    EndDate:
      in: query
      name: endDate
      schema: { type: string, format: date }
    Q:
      in: query
      name: q
      schema: { type: string }
      description: Busca textual.
    AnalysisBy:
      in: query
      name: analysisBy
      schema: { type: string }
    Stage:
      in: query
      name: stage
      schema: { type: integer, enum: [1, 2] }
    ExcludeStage:
      in: query
      name: excludeStage
      schema: { type: integer, enum: [1, 2] }
    Page:
      in: query
      name: page
      schema: { type: integer, default: 1, minimum: 1 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, default: 20, maximum: 100 }
  responses:
    BadRequest:
      description: Parâmetros inválidos.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Sessão admin ausente/expirada.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Sem permissão (role insuficiente).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Erro interno.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
    AnalysisStatus:
      type: string
      enum: [PENDING, SCHEDULED, APPROVED, REJECTED]
    ApprovalAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject, schedule, cancel-schedule, update-schedule]
        rejectionReason: { type: string, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }
    AdminUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role:
          type: string
          enum: [SUPER_ADMIN, AI_MANAGER, SUPPORT]
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AIConfig:
      type: object
      required: [appName, configType, name, content]
      properties:
        id: { type: string }
        appName: { type: string }
        configType:
          type: string
          enum: [PROMPT, MODEL, SETTING]
        name: { type: string }
        description: { type: string }
        content: { type: string }
        version: { type: integer }
        isActive: { type: boolean }
        stage: { type: integer, enum: [1, 2] }
    MealPlanInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        dailyCalories: { type: integer }
        macronutrients:
          type: object
          properties:
            carbs: { type: number }
            protein: { type: number }
            fat: { type: number }
        meals:
          type: array
          items:
            type: object
            properties:
              slot: { type: string }
              foods: { type: array, items: { type: string } }
        orientations: { type: string }
        supplements: { type: string }
        observations: { type: string }
        crossedOutFoods:
          type: array
          items: { type: string }
        analysisStatus: { $ref: "#/components/schemas/AnalysisStatus" }
        analysisStatusBy: { type: string }
    FormSubmissionPayload:
      type: object
      required: [response]
      properties:
        response:
          type: object
          required: [id, formId, answers]
          properties:
            id: { type: string }
            userId: { type: string }
            formId: { type: string }
            answers:
              type: object
              additionalProperties: true
