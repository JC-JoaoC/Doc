<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NPS Alunos · Documentação da API</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <style>
/* ============================================================
   cofounder.css — estética inspirada em cofounder.co/how-to/start
   Tipografia limpa, paleta neutra com acento azul, topbar fina,
   sidebar de seções, conteúdo centralizado em coluna estreita.
   ============================================================ */

:root {
  /* paleta light — fundo branco puro */
  --bg:            #ffffff;
  --bg-soft:       #ffffff;
  --bg-elev:       #ffffff;
  --bg-sidebar:    #ffffff;
  --bg-hover:      #f4f5f7;
  --border:        #e6e8eb;
  --border-strong: #d4d7dc;

  --fg:            #1a1a1a;
  --fg-strong:     #000000;
  --muted:         #5f6570;
  --muted-2:       #8a909a;

  --accent:        #2050ff;
  --accent-hover:  #1a44e6;
  --accent-soft:   #eef2ff;

  --code-bg:       #f4f5f7;
  --code-border:   #e6e8eb;

  --shadow-sm: 0 1px 1px rgba(15, 20, 30, 0.04);
  --shadow-md: 0 1px 2px rgba(15, 20, 30, 0.04), 0 2px 4px rgba(15, 20, 30, 0.04);

  /* dimensões */
  --topbar-h:   60px;
  --sidebar-w:  264px;
  --content-w:  760px;

  /* tipografia */
  --font-sans: "Inter", "Inter Tight", -apple-system, BlinkMacSystemFont,
               "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo,
               "Consolas", monospace;
}

[data-theme="dark"] {
  /* paleta dark — cinza-azulado escuro suave (#1c2022) */
  --bg:            #1c2022;
  --bg-soft:       #1c2022;
  --bg-elev:       #23282b;
  --bg-sidebar:    #1c2022;
  --bg-hover:      #2a3034;
  --border:        #2e3438;
  --border-strong: #3d4549;

  --fg:            #d8dde2;
  --fg-strong:     #f4f6f8;
  --muted:         #9aa2ac;
  --muted-2:       #6c7480;

  --accent:        #8aa7ff;
  --accent-hover:  #a3baff;
  --accent-soft:   #1e2747;

  --code-bg:       #161a1c;
  --code-border:   #2e3438;

  --shadow-sm: 0 1px 1px rgba(0,0,0,0.25);
  --shadow-md: 0 1px 2px rgba(0,0,0,0.25), 0 2px 4px rgba(0,0,0,0.35);
}

/* required tag mais legível no dark */
[data-theme="dark"] .cf-required {
  background: #3a1e1e;
  color: #ff8c8c;
}

/* ---------- reset / base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* transição suave ao alternar entre tema claro/escuro */
html, body,
.cf-topbar, .cf-sidebar, .cf-main, .cf-ribbon,
.cf-content, .cf-card, .cf-pill, .cf-search, .cf-icon,
.cf-sidebar a.cf-nav-item, .cf-topbar .cf-nav a,
.cf-content code, .cf-content pre, .cf-content blockquote,
.cf-content th, .cf-content td,
.cf-swagger, .cf-swagger .swagger-ui,
.cf-swagger .swagger-ui .opblock,
.cf-swagger .swagger-ui .opblock .opblock-section-header {
  transition: background-color .25s ease, color .25s ease, border-color .25s ease;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

/* ---------- topbar (estilo cofounder: barra fina, sem sombra) ---------- */
.cf-topbar {
  position: sticky; top: 0; z-index: 50;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 18px;
  padding: 0 24px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.cf-topbar .cf-brand {
  display: inline-flex; align-items: center; gap: 10px;
  font-weight: 600;
  font-size: 15px;
  color: var(--fg-strong);
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.cf-topbar .cf-brand .cf-logo {
  /* logo removida — mantemos a regra para que o markup existente não
     deixe um espaço fantasma se algum override ressuscitar a classe */
  display: none;
}
.cf-topbar .cf-crumbs {
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--muted);
  font-size: 14px;
}
.cf-topbar .cf-crumbs .cf-sep {
  color: var(--muted-2);
  user-select: none;
}
.cf-topbar .cf-crumbs a { color: var(--muted); }
.cf-topbar .cf-crumbs a:hover { color: var(--fg-strong); }
.cf-topbar .cf-crumbs .cf-current { color: var(--fg-strong); font-weight: 500; }

.cf-topbar .cf-nav {
  display: inline-flex; align-items: center; gap: 4px;
  margin-left: 4px;
}
.cf-topbar .cf-nav a {
  display: inline-flex; align-items: center;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 14px;
  color: var(--muted);
  transition: color .12s ease, background .12s ease;
}
.cf-topbar .cf-nav a:hover { color: var(--fg-strong); background: var(--bg-hover); }
.cf-topbar .cf-nav a.is-active { color: var(--fg-strong); }

.cf-topbar .cf-spacer { flex: 1; }

.cf-topbar .cf-search {
  width: 240px; max-width: 36vw;
  height: 34px;
  padding: 0 10px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--fg);
  font: inherit; font-size: 13px;
  transition: border-color .12s ease, background .12s ease;
}
.cf-topbar .cf-search:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg);
}
.cf-topbar .cf-icon {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--fg);
  cursor: pointer;
  transition: background .12s ease, border-color .12s ease;
}
.cf-topbar .cf-icon:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.cf-topbar .cf-icon svg { width: 16px; height: 16px; }

.cf-topbar .cf-cta {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 14px; height: 34px;
  background: var(--fg-strong); color: var(--bg);
  border: 1px solid var(--fg-strong);
  border-radius: 8px;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: opacity .12s ease;
}
.cf-topbar .cf-cta:hover { opacity: 0.88; }

.cf-topbar .cf-menu-toggle { display: none; }
@media (max-width: 900px) {
  .cf-topbar { gap: 10px; padding: 0 14px; }
  .cf-topbar .cf-menu-toggle { display: grid; }
  .cf-topbar .cf-nav,
  .cf-topbar .cf-crumbs { display: none; }
  .cf-topbar .cf-search { width: 140px; }
  .cf-topbar .cf-cta { display: none; }
}

/* ---------- layout (sidebar + main) ---------- */
.cf-layout {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: calc(100vh - var(--topbar-h));
}
.cf-sidebar {
  position: sticky; top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  padding: 22px 14px 40px;
}
.cf-sidebar .cf-group {
  margin: 18px 10px 4px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted-2);
}
.cf-sidebar .cf-group:first-child { margin-top: 0; }
.cf-sidebar a.cf-nav-item {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  margin: 1px 0;
  border-radius: 6px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.4;
  transition: background .1s ease, color .1s ease;
}
.cf-sidebar a.cf-nav-item:hover { background: var(--bg-hover); color: var(--fg-strong); }
.cf-sidebar a.cf-nav-item.is-active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}
.cf-sidebar a.cf-nav-item .cf-tag {
  font: 10px/1 var(--font-mono);
  font-weight: 500;
  color: var(--muted-2);
  background: var(--code-bg);
  border: 1px solid var(--border);
  padding: 2px 5px;
  border-radius: 4px;
  letter-spacing: 0;
}
.cf-sidebar a.cf-nav-item.is-active .cf-tag {
  color: var(--accent);
  background: var(--bg);
  border-color: var(--accent-soft);
}

.cf-main { min-width: 0; background: var(--bg); }

/* ---------- conteúdo / artigo cofounder ---------- */
.cf-content {
  max-width: var(--content-w);
  margin: 0 auto;
  padding: 56px 28px 96px;
}
.cf-content .cf-eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin: 0 0 14px;
}
.cf-content h1 {
  font-size: 40px;
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -0.025em;
  margin: 0 0 14px;
  color: var(--fg-strong);
}
.cf-content .cf-lede {
  font-size: 18px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0 0 28px;
  max-width: 640px;
}
.cf-content h2 {
  margin: 48px 0 14px;
  font-size: 24px;
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--fg-strong);
}
.cf-content h3 {
  margin: 32px 0 10px;
  font-size: 17px;
  font-weight: 600;
  color: var(--fg-strong);
}
.cf-content p { margin: 0 0 16px; }
.cf-content a:not(.cf-card):not(.cf-pill) {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color .12s ease;
}
.cf-content a:not(.cf-card):not(.cf-pill):hover { border-bottom-color: var(--accent); }
.cf-content code {
  font: 13px/1.4 var(--font-mono);
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  color: var(--fg-strong);
  padding: 1px 5px;
  border-radius: 4px;
}
.cf-content pre {
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  margin: 16px 0;
}
.cf-content pre code { background: transparent; border: 0; padding: 0; }
.cf-content blockquote {
  margin: 16px 0;
  padding: 4px 16px;
  border-left: 3px solid var(--border-strong);
  color: var(--muted);
}
.cf-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 14px;
}
.cf-content th, .cf-content td {
  border: 1px solid var(--border);
  padding: 8px 10px;
  text-align: left;
}
.cf-content th { background: var(--bg-soft); font-weight: 600; }
.cf-content hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
.cf-content ul, .cf-content ol { padding-left: 22px; }
.cf-content li { margin: 4px 0; }

/* ---------- cards (índice/hub) ---------- */
.cf-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
  margin: 20px 0 8px;
}
.cf-card {
  display: block;
  padding: 18px 20px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--fg);
  box-shadow: var(--shadow-sm);
  transition: border-color .12s ease, transform .12s ease, box-shadow .12s ease;
}
.cf-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.cf-card .cf-card-head {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 4px;
}
.cf-card h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--fg-strong);
  letter-spacing: -0.005em;
}
.cf-card .cf-tag {
  font: 10px/1 var(--font-mono);
  color: var(--muted);
  background: var(--code-bg);
  border: 1px solid var(--border);
  padding: 2px 6px;
  border-radius: 4px;
}
.cf-card p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}
.cf-card .cf-card-link {
  display: inline-block;
  margin-top: 10px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
}

/* ---------- pílulas/quicklinks ---------- */
.cf-pills {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin: 8px 0 4px;
}
.cf-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 13px;
  color: var(--fg);
  transition: border-color .12s ease, color .12s ease;
}
.cf-pill:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- "ribbon" para páginas Swagger ---------- */
.cf-ribbon {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding: 18px 28px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.cf-ribbon .cf-ribbon-title {
  display: flex; align-items: center; gap: 10px;
  margin: 0;
  font-size: 18px; font-weight: 600;
  color: var(--fg-strong);
  letter-spacing: -0.01em;
}
.cf-ribbon .cf-meta {
  display: flex; flex-wrap: wrap; gap: 10px;
  color: var(--muted);
  font-size: 12px;
  align-items: center;
}
.cf-ribbon .cf-meta .cf-badge {
  background: var(--accent-soft);
  color: var(--accent);
  padding: 3px 9px;
  border-radius: 999px;
  font: 11px/1 var(--font-mono);
  font-weight: 500;
}
.cf-ribbon .cf-meta .cf-mono {
  font: 11px/1 var(--font-mono);
  color: var(--muted);
}

/* ---------- esconde o topbar nativo do Swagger UI ---------- */
.swagger-ui .topbar { display: none !important; }

/* contêiner do swagger dentro do layout cofounder — herda o --bg do site */
.cf-swagger {
  padding: 8px 0 40px;
  background: var(--bg);
}
.cf-swagger .swagger-ui {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--fg);
}
/* zera os fundos brancos/cinzas internos do swagger-ui para deixar
   tudo casar com o --bg do site (light/dark) */
.cf-swagger .swagger-ui,
.cf-swagger .swagger-ui .wrapper,
.cf-swagger .swagger-ui .information-container,
.cf-swagger .swagger-ui .scheme-container,
.cf-swagger .swagger-ui .opblock-tag,
.cf-swagger .swagger-ui .opblock-tag-section,
.cf-swagger .swagger-ui section.models,
.cf-swagger .swagger-ui section.models.is-open,
.cf-swagger .swagger-ui section.models .model-container {
  background: transparent;
  box-shadow: none;
}
.cf-swagger .swagger-ui .info { margin: 24px 28px; }
.cf-swagger .swagger-ui .info .title,
.cf-swagger .swagger-ui .opblock-tag,
.cf-swagger .swagger-ui .opblock .opblock-summary-path,
.cf-swagger .swagger-ui .opblock .opblock-summary-description,
.cf-swagger .swagger-ui table thead tr td,
.cf-swagger .swagger-ui table thead tr th,
.cf-swagger .swagger-ui .response-col_status,
.cf-swagger .swagger-ui .markdown p,
.cf-swagger .swagger-ui .renderedMarkdown p,
.cf-swagger .swagger-ui .model-title,
.cf-swagger .swagger-ui .model,
.cf-swagger .swagger-ui label {
  color: var(--fg);
}
.cf-swagger .swagger-ui .opblock {
  background: var(--bg);
  border: 1px solid var(--border);
  box-shadow: none;
}
.cf-swagger .swagger-ui .opblock .opblock-section-header {
  background: var(--bg);
  box-shadow: none;
  border-bottom: 1px solid var(--border);
}

/* clareia os blocos de exemplo (request/response) que por padrão vêm com
   fundo #41444e quase preto vindo do swagger-ui.css */
.cf-swagger .swagger-ui pre,
.cf-swagger .swagger-ui .example,
.cf-swagger .swagger-ui .body-param__example,
.cf-swagger .swagger-ui .microlight,
.cf-swagger .swagger-ui .highlight-code,
.cf-swagger .swagger-ui .opblock-body pre.example,
.cf-swagger .swagger-ui .opblock-body pre,
.cf-swagger .swagger-ui .response-col_description__inner pre {
  background: var(--code-bg) !important;
  color: var(--fg) !important;
  border: 1px solid var(--code-border);
  border-radius: 6px;
}
.cf-swagger .swagger-ui pre code,
.cf-swagger .swagger-ui .microlight code,
.cf-swagger .swagger-ui .highlight-code .microlight,
.cf-swagger .swagger-ui .highlight-code span {
  color: var(--fg) !important;
  background: transparent !important;
}

/* ---------- páginas de spec (estilo overview, sem swagger-ui) ---------- */
.cf-info-desc {
  margin: 8px 0 18px;
  color: var(--fg);
  font-size: 15px;
  line-height: 1.6;
}
.cf-info-desc p { margin: 0 0 12px; }
.cf-info-desc ul {
  margin: 8px 0 12px;
  padding-left: 22px;
}
.cf-info-desc li { margin: 4px 0; color: var(--fg); }
.cf-info-desc code {
  font: 13px/1.4 var(--font-mono);
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  color: var(--fg-strong);
  padding: 1px 5px;
  border-radius: 4px;
}
.cf-info-desc a {
  color: var(--accent);
  border-bottom: 1px solid transparent;
  text-decoration: none;
}
.cf-info-desc a:hover { border-bottom-color: var(--accent); }
.cf-servers-title {
  margin: 24px 0 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted-2);
}
.cf-spec-section {
  margin: 48px 0;
}
.cf-spec-section h2 {
  font-size: 24px;
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--fg-strong);
  margin: 0 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.cf-endpoint {
  margin: 20px 0;
  padding: 18px 20px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-sm);
}
.cf-endpoint-head {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 8px;
  flex-wrap: wrap;
}
.cf-method {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 6px;
  color: #fff;
  font: 600 11px/1 var(--font-mono);
  text-transform: uppercase;
  min-width: 56px;
  text-align: center;
  letter-spacing: 0.04em;
}
.cf-path {
  font: 14px/1.4 var(--font-mono);
  color: var(--fg-strong);
  word-break: break-all;
}
.cf-endpoint-summary {
  margin: 4px 0 8px;
  color: var(--muted);
  font-size: 14px;
}
.cf-endpoint-desc {
  margin: 8px 0 12px;
  color: var(--fg);
  font-size: 14px;
}
.cf-endpoint-desc p { margin: 0 0 8px; }
.cf-endpoint h4 {
  margin: 16px 0 8px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted-2);
}
.cf-spec-table {
  width: 100%;
  border-collapse: collapse;
  margin: 4px 0 8px;
  font-size: 13px;
}
.cf-spec-table th, .cf-spec-table td {
  border: 1px solid var(--border);
  padding: 8px 10px;
  text-align: left;
  vertical-align: top;
}
.cf-spec-table th {
  background: var(--bg-hover);
  font-weight: 600;
  color: var(--fg-strong);
  font-size: 12px;
  letter-spacing: 0.02em;
}
.cf-spec-table code {
  font: 12px/1.4 var(--font-mono);
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  color: var(--fg-strong);
  padding: 1px 5px;
  border-radius: 4px;
}
.cf-required {
  display: inline-block;
  padding: 1px 6px;
  background: #fde7e7;
  color: #c43a3a;
  border-radius: 4px;
  font: 600 11px/1 var(--font-mono);
}
.cf-optional {
  color: var(--muted-2);
  font: 600 11px/1 var(--font-mono);
}
.cf-meta-line {
  margin: 4px 0 8px;
  font-size: 13px;
  color: var(--muted);
}
.cf-status-2xx { color: #0a8a3a; font-weight: 600; }
.cf-status-3xx { color: #1a8aa6; font-weight: 600; }
.cf-status-4xx { color: #bb7700; font-weight: 600; }
.cf-status-5xx { color: #c43a3a; font-weight: 600; }

.cf-endpoint-security {
  margin: 8px 0 12px;
  padding: 8px 12px;
  background: var(--accent-soft);
  border-radius: 6px;
  font-size: 13px;
  color: var(--fg);
}
.cf-endpoint-security code {
  font: 12px/1.4 var(--font-mono);
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 1px 5px;
  border-radius: 4px;
}
.cf-endpoint-security a { color: var(--accent); text-decoration: none; }
.cf-endpoint-security a:hover { text-decoration: underline; }

.cf-deprecated {
  margin-left: 8px;
  padding: 2px 8px;
  background: #fde7e7;
  color: #c43a3a;
  border-radius: 4px;
  font: 600 11px/1 var(--font-mono);
  text-transform: uppercase;
}
[data-theme="dark"] .cf-deprecated {
  background: #3a1e1e;
  color: #ff8c8c;
}

/* schemas (mesmo visual do .cf-endpoint, gerido por classe dedicada) */
.cf-schema {
  margin: 16px 0;
  padding: 16px 18px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-sm);
}
.cf-schema .cf-endpoint-head { margin-bottom: 8px; }
.cf-schema .cf-meta-line { color: var(--muted); font-size: 13px; }

/* link dentro da tabela de schemas (referências a outros schemas) */
.cf-spec-table a {
  color: var(--accent);
  text-decoration: none;
}
.cf-spec-table a:hover { text-decoration: underline; }

/* ---------- collapse de endpoints e schemas ---------- */
.cf-endpoint > .cf-endpoint-head,
.cf-schema  > .cf-endpoint-head {
  cursor: pointer;
  user-select: none;
}
.cf-endpoint-summary-inline {
  color: var(--muted);
  font-size: 13px;
  margin-left: 8px;
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cf-collapse-arrow {
  margin-left: auto;
  font-size: 16px;
  color: var(--muted-2);
  transition: transform .15s ease;
  flex-shrink: 0;
}
.cf-endpoint.is-collapsed .cf-collapse-arrow,
.cf-schema.is-collapsed   .cf-collapse-arrow {
  transform: rotate(-90deg);
}
.cf-endpoint.is-collapsed > .cf-endpoint-body,
.cf-schema.is-collapsed   > .cf-endpoint-body {
  display: none;
}
.cf-endpoint-body { padding-top: 8px; }

/* ---------- tabs Example / Schema ---------- */
.cf-tabs {
  margin: 8px 0 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg);
}
.cf-tabs-bar {
  display: flex;
  background: var(--bg-hover);
  border-bottom: 1px solid var(--border);
}
.cf-tab {
  background: transparent;
  border: 0;
  padding: 8px 14px;
  font: 600 11px/1 var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .12s ease, background .12s ease, border-color .12s ease;
}
.cf-tab:hover { color: var(--fg-strong); }
.cf-tab.is-active {
  color: var(--fg-strong);
  background: var(--bg);
  border-bottom-color: var(--accent);
}
.cf-tab-panel { display: none; padding: 12px 14px; }
.cf-tab-panel.is-active { display: block; }

/* bloco de código JSON */
.cf-code {
  margin: 0;
  padding: 12px 14px;
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: 6px;
  font: 12px/1.5 var(--font-mono);
  color: var(--fg-strong);
  overflow-x: auto;
  white-space: pre;
  max-height: 480px;
  overflow-y: auto;
}

/* respostas (lista, não mais tabela) */
.cf-responses {
  display: flex; flex-direction: column;
  gap: 6px;
}
.cf-response {
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
}
.cf-response:last-child { border-bottom: 0; }
.cf-response-head {
  display: flex; align-items: center; gap: 10px;
  font-size: 14px;
}
.cf-response-head code {
  font: 13px/1 var(--font-mono);
  padding: 3px 7px;
  border-radius: 4px;
  background: var(--code-bg);
  border: 1px solid var(--code-border);
}
.cf-response-desc { color: var(--muted); font-size: 13px; }
.cf-body-type { margin: 8px 0; }

/* sidebar — destaque para item ativo via scroll */
.cf-sidebar a.cf-nav-item[href^="#tag-"] .cf-tag {
  background: transparent;
  border-color: transparent;
  color: var(--muted-2);
}

/* ---------- backdrop / drawer mobile ---------- */
.cf-backdrop {
  display: none;
  position: fixed; inset: var(--topbar-h) 0 0 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: 45;
}
.cf-backdrop.is-open { display: block; }

@media (max-width: 900px) {
  .cf-layout { grid-template-columns: 1fr; }
  .cf-sidebar {
    position: fixed;
    top: var(--topbar-h);
    left: 0;
    width: 82vw; max-width: 320px;
    height: calc(100vh - var(--topbar-h));
    z-index: 46;
    transform: translateX(-100%);
    transition: transform .2s ease;
    box-shadow: 4px 0 14px rgba(0, 0, 0, 0.08);
  }
  .cf-sidebar.is-open { transform: translateX(0); }
  .cf-content { padding: 36px 18px 60px; }
  .cf-ribbon { padding: 14px 18px; }
}

  <script id="site-data" type="application/json">{"title":"NPS Alunos · Documentação da API","brand":"NPS Alunos","hero":{"eyebrow":"Documentação","title":"NPS Alunos API","lede":"Referência completa dos endpoints REST de autenticação e das procedures tRPC que alimentam o formulário NPS e o painel administrativo."},"groups":[{"key":"platform","label":"Plataforma"}],"apps":[{"key":"nps","label":"nps-api","group":"platform","tag":"3000","desc":"Auth REST + tRPC: login, sessão, submissão NPS e dashboard administrativo.","title":"NPS Alunos API","contentHtml":"\n    \n    \u003cp class=\"cf-eyebrow\"\u003eAPI\u003c/p\u003e\n    \u003ch1\u003eNPS Alunos API\u003c/h1\u003e\n    \u003cp class=\"cf-lede\"\u003eAPI da aplicação \u003cstrong\u003eNPS Alunos\u003c/strong\u003e. Combina dois transportes:\u003c/p\u003e\n    \u003cdiv class=\"cf-info-desc\"\u003e\u003cul\u003e\u003cli\u003e\u003cstrong\u003eREST clássico\u003c/strong\u003e em \u003ccode\u003e/api/auth/*\u003c/code\u003e para o fluxo de login do painel\u003c/li\u003e\u003cli\u003e\u003cstrong\u003etRPC sobre HTTP\u003c/strong\u003e em \u003ccode\u003e/api/trpc/\u0026lt;procedure\u0026gt;\u003c/code\u003e para o restante das\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e### Envelope tRPC\u003c/p\u003e\n\u003cp\u003eCada procedure tRPC é exposta como uma rota HTTP. A convenção é:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003eQueries\u003c/strong\u003e (\u003ccode\u003eauth.me\u003c/code\u003e, \u003ccode\u003esystem.health\u003c/code\u003e, \u003ccode\u003enps.dashboard\u003c/code\u003e): chamadas\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eMutations\u003c/strong\u003e (\u003ccode\u003eauth.logout\u003c/code\u003e, \u003ccode\u003esystem.notifyOwner\u003c/code\u003e, \u003ccode\u003enps.submit\u003c/code\u003e):\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eRespostas tRPC seguem a estrutura \u003ccode\u003e{\u0026quot;result\u0026quot;: {\u0026quot;data\u0026quot;: {\u0026quot;json\u0026quot;: \u0026lt;payload\u0026gt;}}}\u003c/code\u003e em sucesso e \u003ccode\u003e{\u0026quot;error\u0026quot;: {...}}\u003c/code\u003e em falha. O servidor utiliza o transformer \u003cstrong\u003esuperjson\u003c/strong\u003e, então campos como \u003ccode\u003eDate\u003c/code\u003e chegam serializados e são reconstituídos pelo client.\u003c/p\u003e\n\u003cp\u003e### Autenticação\u003c/p\u003e\n\u003cp\u003eProcedures \u003ccode\u003eadmin*\u003c/code\u003e exigem um cookie \u003ccode\u003eapp_session_id\u003c/code\u003e válido (emitido em \u003ccode\u003ePOST /api/auth/login\u003c/code\u003e) cujo usuário tenha \u003ccode\u003erole = \u0026quot;admin\u0026quot;\u003c/code\u003e. Procedures \u003ccode\u003epublic*\u003c/code\u003e podem ser chamadas sem cookie, mas, se houver cookie válido, o usuário entra no contexto.\u003c/p\u003e\u003c/div\u003e\n    \n  \n    \n    \u003csection class=\"cf-spec-section\" id=\"security\"\u003e\n      \u003ch2\u003eAutenticação\u003c/h2\u003e\n      \n      \u003carticle class=\"cf-schema\" id=\"sec-cookieAuth\"\u003e\n        \u003cheader class=\"cf-endpoint-head\"\u003e\n          \u003cspan class=\"cf-method\" style=\"background:#7c7c7c\"\u003eAUTH\u003c/span\u003e\n          \u003ccode class=\"cf-path\"\u003ecookieAuth\u003c/code\u003e\n        \u003c/header\u003e\n        \u003cdiv class=\"cf-endpoint-desc\"\u003e\u003cp\u003eCookie HTTP-only emitido por \u003ccode\u003ePOST /api/auth/login\u003c/code\u003e. Validade de 1 ano. Procedures \u003ccode\u003eadmin*\u003c/code\u003e exigem que o usuário associado tenha \u003ccode\u003erole = \u0026quot;admin\u0026quot;\u003c/code\u003e.\u003c/p\u003e\u003c/div\u003e\n        \u003cp class=\"cf-meta-line\"\u003etipo: \u003ccode\u003eapiKey\u003c/code\u003e • em: \u003ccode\u003ecookie\u003c/code\u003e • param: \u003ccode\u003eapp_session_id\u003c/code\u003e\u003c/p\u003e\n      \u003c/article\u003e\n    \u003c/section\u003e\n    \n    \u003csection class=\"cf-spec-section\" id=\"tag-Auth%20REST\"\u003e\n      \u003ch2\u003eAuth REST\u003c/h2\u003e\n      \u003cp\u003eEndpoints REST de autenticação (login e cookie de sessão).\u003c/p\u003e\n      \n    \u003carticle class=\"cf-endpoint is-collapsed\" id=\"op-post-api-auth-login\"\u003e\n      \u003cheader class=\"cf-endpoint-head\" data-collapse-toggle\u003e\n        \u003cspan class=\"cf-method\" style=\"background:#0a8a3a\"\u003ePOST\u003c/span\u003e\n        \u003ccode class=\"cf-path\"\u003e/api/auth/login\u003c/code\u003e\n        \u003cspan class=\"cf-endpoint-summary-inline\"\u003eAutentica o administrador e emite cookie de sessão\u003c/span\u003e\n        \n        \u003cspan class=\"cf-collapse-arrow\" aria-hidden=\"true\"\u003e▾\u003c/span\u003e\n      \u003c/header\u003e\n      \u003cdiv class=\"cf-endpoint-body\"\u003e\n        \u003cdiv class=\"cf-endpoint-desc\"\u003e\u003cp\u003eVerifica \u003ccode\u003eemail\u003c/code\u003e / \u003ccode\u003epassword\u003c/code\u003e contra o usuário admin configurado em \u003ccode\u003eADMIN_EMAIL\u003c/code\u003e. Em caso de sucesso, grava o cookie HTTP-only \u003ccode\u003eapp_session_id\u003c/code\u003e com validade de 1 ano.\u003c/p\u003e\n\u003cp\u003eRate limit: \u003cstrong\u003e5 tentativas a cada 15 minutos\u003c/strong\u003e por IP.\u003c/p\u003e\u003c/div\u003e\n        \n        \n        \n    \u003ch4\u003eRequest body \u003cspan class=\"cf-required\"\u003eobrig.\u003c/span\u003e\u003c/h4\u003e\n    \n    \n      \u003cdiv class=\"cf-body-type\"\u003e\n        \u003cp class=\"cf-meta-line\"\u003e\u003ccode\u003eapplication/json\u003c/code\u003e → \u003ca href=\"#schema-LoginInput\"\u003e\u003ccode\u003eLoginInput\u003c/code\u003e\u003c/a\u003e\u003c/p\u003e\n        \u003cdiv class=\"cf-tabs\" data-tabs\u003e\n          \u003cdiv class=\"cf-tabs-bar\"\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab is-active\" data-tab-name=\"example\"\u003eExample Value\u003c/button\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab\" n      \u003cp\u003eProcedures tRPC ligadas à sessão do usuário atual.\u003c/p\u003e\n      \n    \u003carticle class=\"cf-endpoint is-collapsed\" id=\"op-get-api-trpc-auth-me\"\u003e\n      \u003cheader class=\"cf-endpoint-head\" data-collapse-toggle\u003e\n        \u003cspan class=\"cf-method\" style=\"background:#2050ff\"\u003eGET\u003c/span\u003e\n        \u003ccode class=\"cf-path\"\u003e/api/trpc/auth.me\u003c/code\u003e\n        \u003cspan class=\"cf-endpoint-summary-inline\"\u003eRetorna o usuário autenticado pelo cookie de sessão\u003c/span\u003e\n        \n        \u003cspan class=\"cf-collapse-arrow\" aria-hidden=\"true\"\u003e▾\u003c/span\u003e\n      \u003c/header\u003e\n      \u003cdiv class=\"cf-endpoint-body\"\u003e\n        \u003cdiv class=\"cf-endpoint-desc\"\u003e\u003cp\u003eLê o cookie \u003ccode\u003eapp_session_id\u003c/code\u003e, valida a sessão e devolve o registro do usuário no banco — ou \u003ccode\u003enull\u003c/code\u003e se o cookie não existir ou tiver expirado.\u003c/p\u003e\u003c/div\u003e\n        \u003cp class=\"cf-endpoint-security\"\u003e🔒 \u003cstrong\u003eAuth:\u003c/strong\u003e \u003ca href=\"#sec-cookieAuth\"\u003e\u003ccode\u003ecookieAuth\u003c/code\u003e\u003c/a\u003e\u003c/p\u003e\n        \n    \u003ch4\u003eParâmetros\u003c/h4\u003e\n    \u003ctable class=\"cf-spec-table\"\u003e\n      \u003cthead\u003e\u003ctr\u003e\u003cth\u003eNome\u003c/th\u003e\u003cth\u003eEm\u003c/th\u003e\u003cth\u003eTipo\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eDescrição\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody\u003e\n      \u003ctr\u003e\n        \u003ctd\u003e\u003ccode\u003einput\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003equery\u003c/td\u003e\n        \u003ctd\u003e\u003ccode\u003estring\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003cspan class=\"cf-optional\"\u003eopcional\u003c/span\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003cp\u003eInput tRPC URL-encoded. Para p c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003ccode\u003eobject\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003cspan class=\"cf-required\"\u003eobrig.\u003c/span\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003c/td\u003e\n      \u003c/tr\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003c/div\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n    \u003c/section\u003e\n    \u003csection class=\"cf-spec-section\" id=\"tag-NPS\"\u003e\n      \u003ch2\u003eNPS\u003c/h2\u003e\n      \u003cp\u003eColeta e análise de respostas NPS dos alunos.\u003c/p\u003e\n      \n    \u003carticle class=\"cf-endpoint is-collapsed\" id=\"op-post-api-trpc-nps-submit\"\u003e\n      \u003cheader class=\"cf-endpoint-head\" data-collapse-toggle\u003e\n        \u003cspan class=\"cf-method\" style=\"background:#0a8a3a\"\u003ePOST\u003c/span\u003e\n        \u003ccode class=\"cf-path\"\u003e/api/trpc/nps.submit\u003c/code\u003e\n        \u003cspan class=\"cf-endpoint-summary-inline\"\u003eRegistra uma resposta NPS\u003c/span\u003e\n        \n        \u003cspan class=\"cf-collapse-arrow\" aria-hidden=\"true\"\u003e▾\u003c/span\u003e\n      \u003c/header\u003e\n      \u003cdiv class=\"cf-endpoint-body\"\u003e\n        \u003cdiv class=\"cf-endpoint-desc\"\u003e\u003cp\u003eAceita o trio \u003cstrong\u003eemail\u003c/strong\u003e, \u003cstrong\u003escore (0–10)\u003c/strong\u003e e \u003cstrong\u003ecomment\u003c/strong\u003e opcional. Persiste em \u003ccode\u003enpsResponses\u003c/code\u003e e, em background (fire-and-forget), sincroniza tag e custom field no ActiveCampaign. Procedure pública: qualquer aluno pode submeter sem login.\u003c/p\u003e\n\u003cp\u003eO \u003ccode\u003eemail\u003c/code\u003e é normalizado para *lowercase* antes de gravar e os campos \u003ccode\u003ename\u003c/code\u003e e \u003ccode\u003ewhatsapp\u003c/code\u003e na tabela recebem placeholders (\u003ccode\u003eemail\u003c/code\u003e no nome e \u003ccode\u003e\u0026quot;Não informado\u0026quot;\u003c/code\u003e no whatsapp) — vestígios do esquema original do formulário.\u003c/p\u003e\u003c/div\u003e\n        \n        \n        \n    \u003ch4\u003eRequest body \u003cspan class=\"cf-required\"\u003eobrig.\u003c/span\u003e\u003c/h4\u003e\n    \n    \n      \u003cdiv class=\"cf-body-type\"\u003e\n        \u003cp class=\"cf-meta-line\"\u003e\u003ccode\u003eapplication/json\u003c/code\u003e → \u003ccode\u003eobject\u003c/code\u003e\u003c/p\u003e\n        \u003cdiv class=\"cf-tabs\" data-tabs\u003e\n          \u003cdiv class=\"cf-tabs-bar\"\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab is-active\" data-tab-name=\"example\"\u003eExample Value\u003c/button\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab\" data-tab-name=\"schema\"\u003eSchema\u003c/button\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cf-tab-panel is-active\" data-panel-name=\"example\"\u003e\n            \u003cpre class=\"cf-code\"\u003e\u003ccode\u003e{\n  \u0026quot;json\u0026quot;: {\n    \u0026quot;email\u0026quot;: \u0026quot;aluno@example.com\u0026quot;,\n    \u0026quot;score\u0026quot;: 9,\n    \u0026quot;comment\u0026quot;: \u0026quot;Curso excelente, ritmo bem dosado.\u0026quot;\n  }\n}\u003c/code\u003e\u003c/pre\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cf-tab-panel\" data-panel-name=\"schema\"\u003e\n            \n    \u003ctable class=\"cf-spec-table\"\u003e\n      \u003cthead\u003e\u003ctr\u003e\u003cth\u003ePropriedade\u003c/th\u003e\u003cth\u003eTipo\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eDescrição\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody\u003e\n      \u003ctr\u003e\n        \u003ctd\u003e\u003ccode\u003ejson\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003ca href=\"#schema-NpsSubmitInput\"\u003e\u003ccode\u003eNpsSubmitInput\u003c/code\u003e\u003c/a\u003e\u0 "\u003e\n      \u003cthead\u003e\u003ctr\u003e\u003cth\u003ePropriedade\u003c/th\u003e\u003cth\u003eTipo\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eDescrição\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody\u003e\n      \u003ctr\u003e\n        \u003ctd\u003e\u003ccode\u003eresult\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003ccode\u003eobject\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003cspan class=\"cf-required\"\u003eobrig.\u003c/span\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003c/td\u003e\n      \u003c/tr\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"cf-response\"\u003e\n        \u003cdiv class=\"cf-response-head\"\u003e\n          \u003ccode class=\"cf-status-4xx\"\u003e400\u003c/code\u003e\n          \u003cspan class=\"cf-response-desc\"\u003e\u003cp\u003ePayload inválido (zod parse error).\u003c/p\u003e\u003c/span\u003e\n        \u003c/div\u003e\n        \n      \u003cdiv class=\"cf-body-type\"\u003e\n        \u003cp class=\"cf-meta-line\"\u003e\u003ccode\u003eapplication/json\u003c/code\u003e → \u003ca href=\"#schema-TrpcErrorResponse\"\u003e\u003ccode\u003eTrpcErrorResponse\u003c/code\u003e\u003c/a\u003e\u003c/p\u003e\n        \u003cdiv class=\"cf-tabs\" data-tabs\u003e\n          \u003cdiv class=\"cf-tabs-bar\"\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab is-active\" data-tab-name=\"example\"\u003eExample Value\u003c/button\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab\" data-tab-name=\"schema\"\u003eSchema\u003c/button\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cf-tab-panel is-active\" data-panel-name=\"example\"\u003e\n            \u003cpre class=\"cf-code\"\u003e\u003ccode\u003e{\n  \u0026quot;error\u0026quot;: {\n    \u0026quot;message\u0026quot;: \u0026quot;Please login (10001)\u0026quot;,\n    \u0026quot;code\u0026quot;: -32001,\n    \u0026quot;data\u0026quot;: {\n      \u0026quot;code\u0026quot;: \u0026quot;UNAUTHORIZED\u0026quot;,\n      \u0026quot;httpStatus\u0026quot;: 401,\n      \u0026quot;path\u0026quot;: \u0026quot;nps.dashboard\u0026quot;\n    }\n  }\n}\u003c/code\u003e\u003c/pre\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cf-tab-panel\" data-panel-name=\"schema\"\u003e\n            \n    \u003ctable class=\"cf-spec-table\"\u003e\n      \u003cthead\u003e\u003ctr\u003e\u003cth\u003ePropriedade\u003c/th\u003e\u003cth\u003eTipo\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eDescrição\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody\u003e\n      \u003ctr\u003e\n        \u003ctd\u003e\u003ccode\u003eerror\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003ccode\u003eobject\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003cspan class=\"cf-required\"\u003eobrig.\u003c/span\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003c/td\u003e\n      \u003c/tr\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003c/div\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n    \u003carticle class=\"cf-endpoint is-collapsed\" id=\"op-get-api-trpc-nps-dashboard\"\u003e\n      \u003cheader class=\"cf-endpoint-head\" data-collapse-toggle\u003e\n        \u003cspan class=\"cf-method\" style=\"background:#2050ff\"\u003eGET\u003c/span\u003e\n        \u003ccode class=\"cf-path\"\u003e/api/trpc/nps.dashboard\u003c/code\u003e\n        \u003cspan class=\"cf-endpoint-summary-inline\"\u003eLista respostas + métricas NPS agregadas\u003c/span\u003e\n        \n        \u003cspan class=\"cf-collapse-arrow\" aria-hidden=\"true\"\u003e▾\u003c/span\u003e\n      \u003c/header\u003e\n      \u003cdiv class=\"cf-endpoint-body\"\u003e\n        \u003cdiv class=\"cf-endpoint-desc\"\u003e\u003cp\u003eDevolve todas as respostas (mais recentes primeiro) e os indicadores agregados: total, promotores, neutros, detratores, percentuais e o \u003cstrong\u003eNPS Score\u003c/strong\u003e final (\u003ccode\u003e% promotores − % detratores\u003c/code\u003e, arredondado).\u003c/p\u003e\n\u003cp\u003eCada resposta vem enriquecida com \u003ccode\u003ecategory\u003c/code\u003e (\u003ccode\u003epromoter\u003c/code\u003e / \u003ccode\u003eneutral\u003c/code\u003e / \u003ccode\u003edetractor\u003c/code\u003e) e \u003ccode\u003ecategoryLabel\u003c/code\u003e em PT-BR.\u003c/p\u003e\n\u003cp\u003eExige sessão admin.\u003c/p\u003e\u003c/div\u003e\n        \u003cp class=\"cf-endpoint-security\"\u003e🔒 \u003cstrong\u003eAuth:\u003c/strong\u003e \u003ca href=\"#sec-cookieAuth\"\u003e\u003ccode\u003ecookieAuth\u003c/code\u003e\u003c/a\u003e\u003c/p\u003e\n        \n    \u003ch4\u003eParâmetros\u003c/h4\u003e\n    \u003ctable class=\"cf-spec-table\"\u003e\n      \u003cthead\u003e\u003ctr\u003e\u003cth\u003eNome\u003c/th\u003e\u003cth\u003eEm\u003c/th\u003e\u003cth\u003eTipo\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eDescrição\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody\u003e\n      \u003ctr\u003e\n        \u003ctd\u003e\u003ccode\u003einput\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003equery\u003c/td\u003e\n        \u003ctd\u003e\u003ccode\u003estring\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003cspan class=\"cf-optional\"\u003eopcional\u003c/span\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003cp\u003eInput tRPC URL-encoded. Para procedures sem input, basta omitir ou passar \u003ccode\u003e{}\u003c/code\u003e.\u003c/p\u003e\u003c/td\u003e\n      \u003c/tr\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n        \n        \n    \u003ch4\u003eRespostas\u003c/h4\u003e\n    \u003cdiv class=\"cf-responses\"\u003e\n      \u003cdiv class=\"cf-response\"\u003e\n        \u003cdiv class=\"cf-response-head\"\u003e\n          \u003ccode class=\"cf-status-2xx\"\u003e200\u003c/code\u003e\n          \u003cspan class=\"cf-response-desc\"\u003e\u003cp\u003eLista de respostas e métricas.\u003c/p\u003e\u003c/span\u003e\n        \u003c/div\u003e\n        \n      \u003cdiv class=\"cf-body-type\"\u003e\n        \u003cp class=\"cf-meta-line\"\u003e\u003ccode\u003eapplication/json\u003c/code\u003e → \u003ca href=\"#schema-TrpcNpsDashboardResponse\"\u003e\u003ccode\u003eTrpcNpsDashboardResponse\u003c/code\u003e\u003c/a\u003e\u003c/p\u003e\n        \u003cdiv class=\"cf-tabs\" data-tabs\u003e\n          \u003cdiv class=\"cf-tabs-bar\"\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab is-active\" data-tab-name=\"example\"\u003eExample Value\u003c/button\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab\" data-tab-name=\"schema\"\u003eSchema\u003c/button\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cf-tab-panel is-active\" data-panel-name=\"example\"\u003e\n            \u003cpre class=\"cf-code\"\u003e\u003ccode\u003e{\n  \u0026quot;result\u0026quot;: {\n    \u0026quot;data\u0026quot;: {\n      \u0026quot;json\u0026quot;: {\n        \u0026quot;metrics\u0026quot;: {\n          \u0026quot;total\u0026quot;: 120,\n          \u0026quot;promoters\u0026quot;: 72,\n          \u0026quot;neutrals\u0026quot;: 30,\n          \u0026quot;detractors\u0026quot;: 18,\n          \u0026quot;promoterPercentage\u0026quot;: 60,\n          \u0026quot;neutralPercentage\u0026quot;: 25,\n          \u0026quot;detractorPercentage\u0026quot;: 15,\n          \u0026quot;npsScore\u0026quot;: 45\n        },\n        \u0026quot;responses\u0026quot;: [\n          {\n            \u0026quot;id\u0026quot;: 42,\n            \u0026quot;name\u0026quot;: \u0026quot;aluno@example.com\u0026quot;,\n            \u0026quot;email\u0026quot;: \u0026quot;aluno@example.com\u0026quot;,\n            \u0026quot;whatsapp\u0026quot;: \u0026quot;Não informado\u0026quot;,\n            \u0026quot;score\u0026quot;: 9,\n            \u0026quot;comment\u0026quot;: \u0026q    \u003cdiv class=\"cf-endpoint-body\"\u003e\n        \n        \u003cdiv class=\"cf-tabs\" data-tabs\u003e\n          \u003cdiv class=\"cf-tabs-bar\"\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab is-active\" data-tab-name=\"example\"\u003eExample Value\u003c/button\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab\" data-tab-name=\"schema\"\u003eSchema\u003c/button\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cf-tab-panel is-active\" data-panel-name=\"example\"\u003e\n            \u003cpre class=\"cf-code\"\u003e\u003ccode\u003e{\n  \u0026quot;result\u0026quot;: {\n    \u0026quot;data\u0026quot;: {\n      \u0026quot;json\u0026quot;: {\n        \u0026quot;ok\u0026quot;: true\n      }\n    }\n  }\n}\u003c/code\u003e\u003c/pre\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cf-tab-panel\" data-panel-name=\"schema\"\u003e\n            \n    \u003ctable class=\"cf-spec-table\"\u003e\n      \u003cthead\u003e\u003ctr\u003e\u003cth\u003ePropriedade\u003c/th\u003e\u003cth\u003eTipo\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eDescrição\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody\u003e\n      \u003ctr\u003e\n        \u003ctd\u003e\u003ccode\u003eresult\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003ccode\u003eobject\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003cspan class=\"cf-required\"\u003eobrig.\u003c/span\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003c/td\u003e\n      \u003c/tr\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n    \u003carticle class=\"cf-schema is-collapsed\" id=\"schema-TrpcNotifyOwnerResponse\"\u003e\n      \u003cheader class=\"cf-endpoint-head\" data-collapse-toggle\u003e\n        \u003cspan class=\"cf-method\" style=\"background:#7c7c7c\"\u003eOBJECT\u003c/span\u003e\n        \u003ccode class=\"cf-path\"\u003eTrpcNotifyOwnerResponse\u003c/code\u003e\n        \n        \u003cspan class=\"cf-collapse-arrow\" aria-hidden=\"true\"\u003e▾\u003c/span\u003e\n      \u003c/header\u003e\n      \u003cdiv class=\"cf-endpoint-body\"\u003e\n        \n        \u003cdiv class=\"cf-tabs\" data-tabs\u003e\n          \u003cdiv class=\"cf-tabs-bar\"\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab is-active\" data-tab-name=\"example\"\u003eExample Value\u003c/button\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab\" data-tab-name=\"schema\"\u003eSchema\u003c/button\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cf-tab-panel is-active\" data-panel-name=\"example\"\u003e\n            \u003cpre class=\"cf-code\"\u003e\u003ccode\u003e{\n  \u0026quot;result\u0026quot;: {\n    \u0026quot;data\u0026quot;: {\n      \u0026quot;json\u0026quot;: {\n        \u0026quot;success\u0026quot;: true\n      }\n    }\n  }\n}\u003c/code\u003e\u003c/pre\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cf-tab-panel\" data-panel-name=\"schema\"\u003e\n            \n    \u003ctable class=\"cf-spec-table\"\u003e\n      \u003cthead\u003e\u003ctr\u003e\u003cth\u003ePropriedade\u003c/th\u003e\u003cth\u003eTipo\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eDescrição\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody\u003e\n      \u003ctr\u003e\n        \u003ctd\u003e\u003ccode\u003eresult\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003ccode\u003eobject\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003cspan class=\"cf-required\"\u003eobrig.\u003c/span\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003c/td\u003e\n      \u003c/tr\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n    \u003carticle class=\"cf-schema is-collapsed\" id=\"schema-TrpcErrorResponse\"\u003e\n      \u003cheader class=\"cf-endpoint-head\" data-collapse-toggle\u003e\n        \u003cspan class=\"cf-method\" style=\"background:#7c7c7c\"\u003eOBJECT\u003c/span\u003e\n        \u003ccode class=\"cf-path\"\u003eTrpcErrorResponse\u003c/code\u003e\n        \n        \u003cspan class=\"cf-collapse-arrow\" aria-hidden=\"true\"\u003e▾\u003c/span\u003e\n      \u003c/header\u003e\n      \u003cdiv class=\"cf-endpoint-body\"\u003e\n        \n        \u003cdiv class=\"cf-tabs\" data-tabs\u003e\n          \u003cdiv class=\"cf-tabs-bar\"\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab is-active\" data-tab-name=\"example\"\u003eExample Value\u003c/button\u003e\n            \u003cbutton type=\"button\" class=\"cf-tab\" data-tab-name=\"schema\"\u003eSchema\u003c/button\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cf-tab-panel is-active\" data-panel-name=\"example\"\u003e\n            \u003cpre class=\"cf-code\"\u003e\u003ccode\u003e{\n  \u0026quot;error\u0026quot;: {\n    \u0026quot;message\u0026quot;: \u0026quot;Please login (10001)\u0026quot;,\n    \u0026quot;code\u0026quot;: -32001,\n    \u0026quot;data\u0026quot;: {\n      \u0026quot;code\u0026quot;: \u0026quot;UNAUTHORIZED\u0026quot;,\n      \u0026quot;httpStatus\u0026quot;: 401,\n      \u0026quot;path\u0026quot;: \u0026quot;nps.dashboard\u0026quot;\n    }\n  }\n}\u003c/code\u003e\u003c/pre\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cf-tab-panel\" data-panel-name=\"schema\"\u003e\n            \n    \u003ctable class=\"cf-spec-table\"\u003e\n      \u003cthead\u003e\u003ctr\u003e\u003cth\u003ePropriedade\u003c/th\u003e\u003cth\u003eTipo\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003eDescrição\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody\u003e\n      \u003ctr\u003e\n        \u003ctd\u003e\u003ccode\u003eerror\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003ccode\u003eobject\u003c/code\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003cspan class=\"cf-required\"\u003eobrig.\u003c/span\u003e\u003c/td\u003e\n        \u003ctd\u003e\u003c/td\u003e\n      \u003c/tr\u003e\u003c/tbody\u003e\n    \u003c/table\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n    \u003c/section\u003e\n  "}],"overviews":[]}</script>
  <script>
    const data = JSON.parse(document.getElementById('site-data').textContent);
    const apps = data.apps;
    const overviews = data.overviews;
    const groups = data.groups;

    // ---------- THEME ----------
    const SVG_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    const SVG_SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
    const themeBtn = document.getElementById('themeToggle');
    function paintThemeIcon() {
      const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      themeBtn.innerHTML = theme === 'dark' ? SVG_MOON : SVG_SUN;
      const label = theme === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro';
      themeBtn.setAttribute('aria-label', label);
      themeBtn.setAttribute('title', label);
    }
    const savedTheme = localStorage.getItem('cf-theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    paintThemeIcon();
    themeBtn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('cf-theme', next);
      paintThemeIcon();
    });

    // ---------- SIDEBAR ----------
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('backdrop');
    document.getElementById('menuToggle').addEventListener('click', () => {
      const opened = sidebar.classList.toggle('is-open');
      backdrop.classList.toggle('is-open', opened);
    });
    backdrop.addEventListener('click', () => {
      sidebar.classList.remove('is-open');
      backdrop.classList.remove('is-open');
    });

    function navItemHtml(route, label, tag) {
      const tagHtml = tag ? `<span class="cf-tag">${tag}</span>` : '';
      return `<a class="cf-nav-item" data-route="${route}" href="#/${route}">${label}${tagHtml}</a>`;
    }

    function populateSidebar() {
      let html = '';
      html += '<a class="cf-nav-item" data-route="home" href="#/home">Início</a>';
      for (const g of groups) {
        const ovs = overviews.filter(o => o.group === g.key);
        const ais = apps.filter(a => a.group === g.key);
        if (!ovs.length && !ais.length) continue;
        html += `<div class="cf-group">${g.label}</div>`;
        for (const o of ovs) html += navItemHtml('md-' + o.key, o.label, 'md');
        for (const a of ais) html += navItemHtml(a.key, a.label, a.tag || 'api');
      }
      sidebar.innerHTML = html;
    }

    function cardHtml(a) {
      const tag = a.tag ? `<span class="cf-tag">${a.tag}</span>` : '';
      return `<a class="cf-card" data-route="${a.key}" href="#/${a.key}">
        <div class="cf-card-head"><h3>${a.label}</h3>${tag}</div>
        <p>${a.desc || ''}</p>
        <span class="cf-card-link">Abrir →</span>
      </a>`;
    }

    function populateHomeCards() {
      const container = document.getElementById('homeCards');
      let html = '';
      for (const g of groups) {
        const list = apps.filter(a => a.group === g.key);
        if (!list.length) continue;
        html += '<div class="cf-cards-section"><div class="cf-cards">';
        html += '<h2 class="cf-section-title">' + g.label + '</h2>';
        html += list.map(cardHtml).join('');
        html += '</div></div>';
      }
      container.innerHTML = html;
    }

    // ---------- ROUTER ----------
    let currentRoute = null;
    function setRoute(route) {
      currentRoute = route;
      document.querySelectorAll('a.cf-nav-item').forEach(el => {
        el.classList.toggle('is-active', el.dataset.route === route);
      });
      const isHome = route === 'home';
      const isMd = route.startsWith('md-');
      document.getElementById('view-home').classList.toggle('is-active', isHome);
      document.getElementById('view-md').classList.toggle('is-active', isMd);
      document.getElementById('view-spec').classList.toggle('is-active', !isHome && !isMd);
      if (isHome) {
        document.title = data.title;
      } else if (isMd) {
        const o = overviews.find(x => 'md-' + x.key === route);
        if (!o) { setRoute('home'); return; }
        document.title = o.label + ' · ' + data.title;
        document.getElementById('mdContent').innerHTML =
          window.marked ? marked.parse(o.md) : o.md;
      } else {
        const info = apps.find(x => x.key === route);
        if (!info) { setRoute('home'); return; }
        document.title = info.title + ' · ' + data.title;
        document.getElementById('specContent').innerHTML = info.contentHtml;
      }
      sidebar.classList.remove('is-open');
      backdrop.classList.remove('is-open');
      if (history.replaceState) history.replaceState(null, '', '#/' + route);
      window.scrollTo(0, 0);
    }

    // ---------- tabs Example/Schema ----------
    document.body.addEventListener('click', (e) => {
      const tab = e.target.closest && e.target.closest('.cf-tab[data-tab-name]');
      if (!tab) return;
      e.preventDefault();
      const container = tab.closest('[data-tabs]');
      if (!container) return;
      const name = tab.getAttribute('data-tab-name');
      container.querySelectorAll('.cf-tab').forEach(t => {
        t.classList.toggle('is-active', t.getAttribute('data-tab-name') === name);
      });
      container.querySelectorAll('.cf-tab-panel').forEach(p => {
        p.classList.toggle('is-active', p.getAttribute('data-panel-name') === name);
      });
    });

    // ---------- collapse de endpoints/schemas ----------
    document.body.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      if (e.target.closest('button') && !e.target.closest('[data-collapse-toggle]')) return;
      const head = e.target.closest('[data-collapse-toggle]');
      if (!head) return;
      const card = head.parentNode;
      if (card) card.classList.toggle('is-collapsed');
    });

    // ---------- SEARCH ----------
    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('.cf-sidebar a.cf-nav-item').forEach(el => {
        const txt = el.textContent.toLowerCase();
        el.style.display = !q || txt.includes(q) ? '' : 'none';
      });
    });

    // ---------- INIT ----------
    populateSidebar();
    populateHomeCards();
    if (window.marked) marked.setOptions({ gfm: true, breaks: false, headerIds: true });

    document.body.addEventListener('click', (e) => {
      const el = e.target.closest('[data-route]');
      if (!el) return;
      e.preventDefault();
      setRoute(el.dataset.route);
    });

    const initial = (location.hash || '').replace(/^#\/?/, '') || 'home';
    setRoute(initial);
    window.addEventListener('hashchange', () => {
      const r = (location.hash || '').replace(/^#\/?/, '') || 'home';
      if (r !== currentRoute) setRoute(r);
    });
  </script>
</body>
</html>
