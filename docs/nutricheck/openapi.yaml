openapi: 3.1.0
info:
  title: nutricheck API
  version: 1.0.0
  description: |
    **nutricheck** — Análise nutricional.

    Armazena vitaminas (D, B12, B1, B6, C, A, ácido fólico), minerais (ferro
    sérico, ferritina, transferrina, saturação de transferrina, zinco,
    magnésio, selênio) e calcula razões/índices (saturação calculada, índice
    ferritina/ferro, razão B12/folato, score antioxidante 0-4). Detecta
    correlações entre nutrientes.

    - **Porta dev:** 3004
    - **Domínio:** https://nutricheck.nutricao360.com/
    - **Tabela do app:** `nutri_analyses`
    - **Auth:** cookie `__session_nutri` (JWT HS256, 1 ano)
servers:
  - url: http://localhost:3004
    description: Desenvolvimento
  - url: https://nutricheck.nutricao360.com
    description: Produção
tags:
  - name: Auth (REST)
  - name: Webhooks
  - name: tRPC - system
  - name: tRPC - auth
  - name: tRPC - analysis
    description: Persistência e histórico de análises nutricionais.
paths:
  /api/oauth/callback:
    get:
      tags: [Auth (REST)]
      summary: Callback OAuth
      parameters:
        - { in: query, name: code, required: true, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
      responses:
        "302": { description: Redireciona para `/` com cookie de sessão. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/webhook/guru:
    get:
      tags: [Webhooks]
      summary: Healthcheck do webhook
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: guru-webhook }
    post:
      tags: [Webhooks]
      summary: Evento de assinatura Guru
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuruWebhookPayload" }
      responses:
        "200": { $ref: "#/components/responses/WebhookOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/trpc/system.health:
    get:
      tags: [tRPC - system]
      summary: system.health (query, public)
      parameters: [{ $ref: "#/components/parameters/TrpcInput" }]
      responses:
        "200": { $ref: "#/components/responses/TrpcOk" }
  /api/trpc/system.notifyOwner:
    post:
      tags: [tRPC - system]
      summary: system.notifyOwner (mutation, admin)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TrpcOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/trpc/auth.me:
    get:
      tags: [tRPC - auth]
      summary: auth.me (query, public)
      parameters: [{ $ref: "#/components/parameters/TrpcInput" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            oneOf:
                              - $ref: "#/components/schemas/User"
                              - type: "null"
  /api/trpc/auth.logout:
    post:
      tags: [tRPC - auth]
      summary: auth.logout (mutation, public)
      responses:
        "200": { $ref: "#/components/responses/SuccessTrue" }
  /api/trpc/auth.emailAccess:
    post:
      tags: [tRPC - auth]
      summary: auth.emailAccess (mutation, public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "200": { $ref: "#/components/responses/EmailAccessOk" }
  /api/trpc/auth.checkAccess:
    get:
      tags: [tRPC - auth]
      summary: auth.checkAccess (query, public)
      parameters: [{ $ref: "#/components/parameters/TrpcInput" }]
      responses:
        "200": { $ref: "#/components/responses/TrpcOk" }

  /api/trpc/analysis.create:
    post:
      tags: [tRPC - analysis]
      summary: analysis.create (mutation, protected)
      description: |
        Recebe `exams` (mapa `nome → valor|null`), calcula razões/índices e
        correlações, persiste em `nutri_analyses` e devolve `id`, razões e
        correlações detectadas.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [analysisDate]
              properties:
                analysisDate: { type: integer, description: "Timestamp em ms." }
                exams:
                  type: object
                  description: Mapa `examId → valor (number|null)`.
                  additionalProperties: { type: number, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            type: object
                            required: [id, ratios, correlations]
                            properties:
                              id: { type: integer }
                              ratios:
                                type: object
                                additionalProperties: { type: number, nullable: true }
                              correlations:
                                type: array
                                items: { $ref: "#/components/schemas/Correlation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/trpc/analysis.list:
    get:
      tags: [tRPC - analysis]
      summary: analysis.list (query, protected)
      description: Lista as análises nutricionais do usuário em ordem decrescente.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/TrpcInput" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            type: array
                            items: { $ref: "#/components/schemas/Analysis" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/trpc/analysis.getById:
    get:
      tags: [tRPC - analysis]
      summary: analysis.getById (query, protected)
      description: Retorna uma análise pelo `id` (apenas se pertencer ao usuário) ou `null`.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/TrpcInput" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            oneOf:
                              - $ref: "#/components/schemas/Analysis"
                              - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/trpc/analysis.delete:
    post:
      tags: [tRPC - analysis]
      summary: analysis.delete (mutation, protected)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: integer } } }
      responses:
        "200": { $ref: "#/components/responses/SuccessBool" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: __session_nutri }
  parameters:
    TrpcInput:
      in: query
      name: input
      schema: { type: string }
      description: Input do procedure serializado como JSON URL-encoded (tRPC v10).
  responses:
    BadRequest:
      description: Parâmetros inválidos.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Não autenticado.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Requer role de admin.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ServerError:
      description: Erro interno.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TrpcOk:
      description: OK
      content: { application/json: { schema: { $ref: "#/components/schemas/TrpcResult" } } }
    WebhookOk:
      description: Evento aceito.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
    EmailAccessOk:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/TrpcResult"
              - properties:
                  result:
                    properties:
                      data:
                        oneOf:
                          - type: object
                            properties:
                              success: { const: true }
                              user: { $ref: "#/components/schemas/User" }
                          - type: object
                            properties:
                              success: { const: false }
                              error: { type: string }
    SuccessTrue:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/TrpcResult"
              - properties:
                  result:
                    properties:
                      data:
                        type: object
                        properties:
                          success: { type: boolean, example: true }
    SuccessBool:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/TrpcResult"
              - properties:
                  result:
                    properties:
                      data:
                        type: object
                        properties:
                          success: { type: boolean }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
    User:
      type: object
      required: [id, openId, role, createdAt, updatedAt, lastSignedIn]
      properties:
        id: { type: integer }
        openId: { type: string }
        name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        loginMethod: { type: string, nullable: true }
        role: { type: string, enum: [user, admin] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastSignedIn: { type: string, format: date-time }
    TrpcResult:
      type: object
      properties:
        result:
          type: object
          properties: { data: {} }
    GuruWebhookPayload:
      type: object
      required: [api_token]
      properties:
        api_token: { type: string }
        id: { type: string }
        event: { type: string }
        status: { type: string }
        contact:
          type: object
          properties:
            email: { type: string, format: email }
            name: { type: string }
        product:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
    Correlation:
      type: object
      required: [id, title, severity, description]
      properties:
        id: { type: integer }
        title: { type: string }
        severity: { type: string, enum: [alert, attention] }
        description: { type: string }
    Analysis:
      type: object
      required: [id, userId, analysisDate, createdAt, updatedAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        analysisDate: { type: string, format: date-time }
        vitaminaD: { type: number, nullable: true }
        vitaminaB12: { type: number, nullable: true }
        acidoFolico: { type: number, nullable: true }
        ferroSerico: { type: number, nullable: true }
        ferritina: { type: number, nullable: true }
        transferrina: { type: number, nullable: true }
        satTransferrina: { type: number, nullable: true }
        zinco: { type: number, nullable: true }
        magnesio: { type: number, nullable: true }
        selenio: { type: number, nullable: true }
        vitaminaB1: { type: number, nullable: true }
        vitaminaB6: { type: number, nullable: true }
        vitaminaC: { type: number, nullable: true }
        vitaminaA: { type: number, nullable: true }
        satTransferrinaCalc: { type: number, nullable: true }
        indiceFerritinaFerro: { type: number, nullable: true }
        razaoB12Folato: { type: number, nullable: true }
        scoreAntioxidante: { type: number, nullable: true }
        correlations:
          type: string
          nullable: true
          description: JSON serializado contendo array de `Correlation`.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
