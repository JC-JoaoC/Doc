openapi: 3.1.0
info:
  title: admin API
  version: 1.0.0
  description: |
    **admin** — Painel administrativo central da Nutricao360.

    Backoffice completo: gestão de admins, usuários finais, exames, planos
    alimentares, relatórios, suplementos, IA, base de conhecimento (RAG),
    integrações Hotmart/Guru/FirePay, webhooks de formulários CDA (Etapa 1 e 2)
    e crons internos. Quase todas as rotas exigem `requireAdmin` (cookie/JWT
    NextAuth + role de admin); algumas usam só `getServerSession`.

    - **Porta dev:** 3005
    - **Auth principal:** `requireAdmin` (NextAuth + role)
    - **API externa:** `GET /api/external/meal-plans/by-email` autenticada por `x-api-key`
servers:
  - url: http://localhost:3005
    description: Desenvolvimento
  - url: https://admin.nutricao360.com
    description: Produção
tags:
  - { name: Meta,             description: Spec OpenAPI exposta pelo app. }
  - { name: Auth,             description: Login/logout admin e NextAuth. }
  - { name: Admin Users,      description: Gestão de AdminUser. }
  - { name: AI Config,        description: Prompts, modelos e settings de IA. }
  - { name: Analytics,        description: Stats, rankings, timeline e export. }
  - { name: Clients,          description: Clientes B2B. }
  - { name: Exams,            description: Exames — listagem, edição e fluxo de aprovação. }
  - { name: Meal Plans,       description: Planos alimentares. }
  - { name: Reports,          description: Relatórios de evolução. }
  - { name: Supplements,      description: Suplementações. }
  - { name: Knowledge Base,   description: Base de conhecimento (RAG) e referências. }
  - { name: Users,            description: Usuários finais (CRUD + merge + status). }
  - { name: Stats,            description: Stats gerais do painel. }
  - { name: External,         description: API externa autenticada por x-api-key. }
  - { name: Cron,             description: Tarefas agendadas. }
  - { name: FirePay,          description: Integração de pagamentos FirePay. }
  - { name: Webhooks,         description: Webhooks de formulários CDA e pagamentos. }
paths:
  /api/swagger:
    get:
      tags: [Meta]
      summary: OpenAPI spec do app admin
      responses:
        "200": { description: Spec OpenAPI 3.1 em JSON. }

  /api/admin/login:
    post:
      tags: [Auth]
      summary: Login do admin (bcrypt + AuditLog)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Sessão emitida (cookie).
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/logout:
    post:
      tags: [Auth]
      summary: Logout do admin
      security: [{ adminSession: [] }]
      responses:
        "200": { description: Sessão encerrada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/auth/{...nextauth}:
    get:
      tags: [Auth]
      summary: NextAuth catch-all (sessão/providers/csrf)
      parameters:
        - in: path
          name: nextauth
          required: true
          schema: { type: array, items: { type: string } }
          style: simple
      responses:
        "200": { description: OK }
        "302": { description: Redirect }
    post:
      tags: [Auth]
      summary: NextAuth catch-all (signin/signout/callbacks)
      parameters:
        - in: path
          name: nextauth
          required: true
          schema: { type: array, items: { type: string } }
          style: simple
      responses:
        "200": { description: OK }
        "302": { description: Redirect }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/activity:
    get:
      tags: [Analytics]
      summary: Atividades recentes (24h)
      description: Audit log + usuários, planos e exames das últimas 24h.
      security: [{ adminSession: [] }]
      responses:
        "200": { description: Lista de atividades. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/admin-users:
    get:
      tags: [Admin Users]
      summary: Lista paginada de AdminUser
      security: [{ adminSession: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Lista paginada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Admin Users]
      summary: Cria AdminUser (bcrypt)
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                role:
                  type: string
                  enum: [SUPER_ADMIN, AI_MANAGER, SUPPORT]
      responses:
        "200":
          description: AdminUser criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: E-mail já em uso.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/admin-users/{id}:
    put:
      tags: [Admin Users]
      summary: Atualiza AdminUser
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role:
                  type: string
                  enum: [SUPER_ADMIN, AI_MANAGER, SUPPORT]
                isActive: { type: boolean }
                password: { type: string }
      responses:
        "200":
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: E-mail já em uso.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Admin Users]
      summary: Exclui AdminUser
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Excluído. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/ai-config:
    get:
      tags: [AI Config]
      summary: Lista AIConfig
      security: [{ adminSession: [] }]
      parameters:
        - { in: query, name: app, schema: { type: string } }
        - { in: query, name: stage, schema: { type: integer, enum: [1, 2] } }
      responses:
        "200":
          description: Lista de configs.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [AI Config]
      summary: Cria AIConfig
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIConfig" }
      responses:
        "200": { description: Criado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [AI Config]
      summary: Atualiza AIConfig
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { type: object, required: [id], properties: { id: { type: string } } }
                - { $ref: "#/components/schemas/AIConfig" }
      responses:
        "200": { description: Atualizado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [AI Config]
      summary: Exclui AIConfig
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "200": { description: Excluído. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/ai-config/settings:
    post:
      tags: [AI Config]
      summary: Salva chaves de API e limites em SystemConfig
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                openaiApiKey: { type: string }
                openrouterApiKey: { type: string }
                googleAiApiKey: { type: string }
                googleModelId: { type: string }
                preferredProvider:
                  type: string
                  enum: [openai, openrouter, google]
                mistralApiKey: { type: string }
                monthlyCostLimit: { type: number }
                rateLimit: { type: integer }
      responses:
        "200": { description: Salvo. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/ai-config/test-connection:
    post:
      tags: [AI Config]
      summary: Testa conexões com OpenAI/OpenRouter/Google AI
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: Status de cada provedor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  openai: { type: object, properties: { ok: { type: boolean }, error: { type: string } } }
                  openrouter: { type: object, properties: { ok: { type: boolean }, error: { type: string } } }
                  google: { type: object, properties: { ok: { type: boolean }, error: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/analysts:
    get:
      tags: [Analytics]
      summary: Lista nomes únicos de admins ativos para filtros
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: Lista de nomes.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/analytics/summary:
    get:
      tags: [Analytics]
      summary: Sumário agregado por categoria (com ETag/304)
      security: [{ adminSession: [] }]
      parameters:
        - { in: query, name: period, schema: { type: string } }
        - { in: query, name: startDate, schema: { type: string, format: date } }
        - { in: query, name: endDate,   schema: { type: string, format: date } }
        - { in: query, name: stage, schema: { type: integer, enum: [1, 2] } }
        - { in: header, name: If-None-Match, schema: { type: string } }
      responses:
        "200":
          description: Sumário.
          headers:
            ETag:
              schema: { type: string }
        "304": { description: Não modificado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/analytics/timeline:
    get:
      tags: [Analytics]
      summary: Timeline diária de entregas e agendamentos
      security: [{ adminSession: [] }]
      parameters:
        - { in: query, name: period, schema: { type: string } }
        - { in: query, name: startDate, schema: { type: string, format: date } }
        - { in: query, name: endDate, schema: { type: string, format: date } }
        - { in: query, name: stage, schema: { type: integer, enum: [1, 2] } }
      responses:
        "200": { description: Timeline. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/analytics/rankings:
    get:
      tags: [Analytics]
      summary: Ranking de colaboradores
      security: [{ adminSession: [] }]
      parameters:
        - { in: query, name: period, schema: { type: string } }
        - { in: query, name: startDate, schema: { type: string, format: date } }
        - { in: query, name: endDate, schema: { type: string, format: date } }
        - { in: query, name: stage, schema: { type: integer, enum: [1, 2] } }
      responses:
        "200": { description: Rankings (entregas/agendamentos/rejeições). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/analytics/export:
    get:
      tags: [Analytics]
      summary: Exporta analytics em XLSX ou CSV
      security: [{ adminSession: [] }]
      parameters:
        - { in: query, name: format, schema: { type: string, enum: [xlsx, csv], default: xlsx } }
        - { in: query, name: period, schema: { type: string } }
        - { in: query, name: startDate, schema: { type: string, format: date } }
        - { in: query, name: endDate, schema: { type: string, format: date } }
        - { in: query, name: stage, schema: { type: integer, enum: [1, 2] } }
      responses:
        "200":
          description: Arquivo.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
            text/csv: {}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/clients:
    get:
      tags: [Clients]
      summary: Lista clientes B2B com uso/receita do mês
      security: [{ adminSession: [] }]
      responses:
        "200": { description: Lista de clientes. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/exams:
    get:
      tags: [Exams]
      summary: Lista paginada de Exam com filtros
      security: [{ adminSession: [] }]
      parameters:
        - { in: query, name: status, schema: { $ref: "#/components/schemas/AnalysisStatus" } }
        - { in: query, name: startDate, schema: { type: string, format: date } }
        - { in: query, name: endDate, schema: { type: string, format: date } }
        - { in: query, name: q, schema: { type: string }, description: Busca textual. }
        - { in: query, name: analysisBy, schema: { type: string } }
        - { in: query, name: stage, schema: { type: integer, enum: [1, 2] } }
        - { in: query, name: excludeStage, schema: { type: integer, enum: [1, 2] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Lista paginada.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/exams/{id}:
    get:
      tags: [Exams]
      summary: Detalhes de um exame
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Exame. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Exams]
      summary: Atualiza campos do exame
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName: { type: string }
                extractedText: { type: string }
                analysis: { type: string }
                analysisStatus: { $ref: "#/components/schemas/AnalysisStatus" }
                analysisStatusBy: { type: string }
      responses:
        "200": { description: Atualizado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/exams/{id}/approve:
    post:
      tags: [Exams]
      summary: Approve/reject/schedule/cancel-schedule/update-schedule
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalAction" }
      responses:
        "200": { description: Ação aplicada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/exams/{id}/download-pdf:
    get:
      tags: [Exams]
      summary: Gera e baixa PDF do exame
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: PDF.
          content:
            application/pdf: {}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/exams/{id}/generate-analysis:
    post:
      tags: [Exams]
      summary: Gera análise via IA (OpenRouter) com RAG
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Análise gerada. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/exams/{id}/resend-email:
    post:
      tags: [Exams]
      summary: Reenvia e-mail do exame aprovado
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: E-mail enviado. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/exams/analysts:
    get:
      tags: [Exams]
      summary: Lista analysisStatusBy distinto de exames
      security: [{ adminSession: [] }]
      responses:
        "200": { description: Lista de analistas. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/exams/manual-upload:
    post:
      tags: [Exams]
      summary: Upload manual admin (PDF OCR via Mistral ou texto)
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                clientName: { type: string }
                clientPhone: { type: string }
                clientEmail: { type: string, format: email }
                stage: { type: integer, enum: [1, 2] }
                file0: { type: string, format: binary }
                file1: { type: string, format: binary }
          application/json:
            schema:
              type: object
              properties:
                clientName: { type: string }
                clientPhone: { type: string }
                clientEmail: { type: string, format: email }
                stage: { type: integer, enum: [1, 2] }
                examText: { type: string }
                examTitle: { type: string }
      responses:
        "200": { description: Exame criado. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/meal-plans:
    get:
      tags: [Meal Plans]
      summary: Lista paginada de MealPlan
      security: [{ adminSession: [] }]
      parameters:
        - $ref: "#/components/parameters/AnalysisStatusQuery"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/AnalysisBy"
        - $ref: "#/components/parameters/Stage"
        - $ref: "#/components/parameters/ExcludeStage"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Lista. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/meal-plans/{id}:
    get:
      tags: [Meal Plans]
      summary: Detalhes do plano alimentar
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Plano. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Meal Plans]
      summary: Atualiza plano (garante slot em meals)
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealPlanInput" }
      responses:
        "200": { description: Atualizado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Meal Plans]
      summary: Exclui plano (somente SUPER_ADMIN)
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Excluído. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/admin/meal-plans/{id}/approve:
    post:
      tags: [Meal Plans]
      summary: Approve/reject/schedule/cancel-schedule/update-schedule
      security: [{ adminSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalAction" }
      responses:
