openapi: 3.1.0
info:
  title: aquaflow API
  version: 1.0.0
  description: |
    **aquaflow** — App de rastreamento de hidratação personalizada.

    Calcula meta diária de água a partir de peso, atividade física, clima, gestação/
    lactação e gera uma estratégia de slots distribuídos ao longo do dia (acordar,
    pré-refeição, treino, dormir). O usuário marca cada slot como concluído e o app
    apresenta resumo diário e histórico.

    - **Porta dev:** 3001
    - **Domínio:** https://aqua.nutricao360.com/
    - **Tabelas do app:** `aqua_profiles`, `aqua_intake_records`
    - **Auth:** cookie `__session_aqua` (JWT HS256, 1 ano)

    A maior parte da API é exposta via tRPC v10 sob `/api/trpc/{router}.{procedure}`.
    Queries vão por `GET` com `input` URL-encoded; mutations por `POST` com body JSON.
servers:
  - url: http://localhost:3001
    description: Desenvolvimento
  - url: https://aqua.nutricao360.com
    description: Produção
tags:
  - name: Auth (REST)
    description: Callback OAuth de provedor externo.
  - name: Webhooks
    description: Eventos da plataforma Guru.
  - name: tRPC - system
    description: Healthcheck e notificações administrativas.
  - name: tRPC - auth
    description: Sessão, login por e-mail (Guru) e verificação de assinatura.
  - name: tRPC - profile
    description: Perfil de hidratação do usuário (peso, atividade, clima, refeições, treino, copo).
  - name: tRPC - intake
    description: Registros diários de ingestão de água por slot.
  - name: tRPC - history
    description: Resumos diários consolidados para histórico.
paths:
  /api/oauth/callback:
    get:
      tags: [Auth (REST)]
      summary: Callback OAuth
      description: |
        Troca `code` + `state` do IdP por um token, busca o usuário, faz upsert em
        `users`, emite JWT e define o cookie `__session_aqua`. Em seguida redireciona
        para `/`.
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        "302": { description: Redireciona para `/` com cookie de sessão definido. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/webhook/guru:
    get:
      tags: [Webhooks]
      summary: Healthcheck do webhook
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: guru-webhook }
    post:
      tags: [Webhooks]
      summary: Evento de assinatura Guru
      description: |
        Valida `api_token`, persiste o payload em `guru_webhook_events` e faz upsert
        em `guru_subscriptions`. Produtos desconhecidos são logados e ignorados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuruWebhookPayload" }
      responses:
        "200": { $ref: "#/components/responses/WebhookOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/trpc/system.health:
    get:
      tags: [tRPC - system]
      summary: system.health (query, public)
      description: "Sonda de liveness — retorna `{ ok: true }`."
      parameters:
        - $ref: "#/components/parameters/TrpcInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrpcResult"

  /api/trpc/system.notifyOwner:
    post:
      tags: [tRPC - system]
      summary: system.notifyOwner (mutation, admin)
      description: Envia uma notificação ao proprietário (canal interno).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string }
                content: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            type: object
                            properties:
                              success: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/trpc/auth.me:
    get:
      tags: [tRPC - auth]
      summary: auth.me (query, public)
      description: Retorna o usuário logado (`User`) ou `null`.
      parameters:
        - $ref: "#/components/parameters/TrpcInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            oneOf:
                              - $ref: "#/components/schemas/User"
                              - type: "null"

  /api/trpc/auth.logout:
    post:
      tags: [tRPC - auth]
      summary: auth.logout (mutation, public)
      description: Limpa o cookie de sessão.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            type: object
                            properties:
                              success: { type: boolean, example: true }

  /api/trpc/auth.emailAccess:
    post:
      tags: [tRPC - auth]
      summary: auth.emailAccess (mutation, public)
      description: |
        Faz login por e-mail. Verifica assinatura ativa na Guru (local + API). Se
        ativa, faz upsert em `users` e define cookie `__session_aqua`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            oneOf:
                              - type: object
                                properties:
                                  success: { const: true }
                                  user: { $ref: "#/components/schemas/User" }
                              - type: object
                                properties:
                                  success: { const: false }
                                  error: { type: string }

  /api/trpc/auth.checkAccess:
    get:
      tags: [tRPC - auth]
      summary: auth.checkAccess (query, public)
      description: Verifica assinatura Guru de um e-mail sem efetuar login.
      parameters:
        - $ref: "#/components/parameters/TrpcInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            type: object
                            properties:
                              hasAccess: { type: boolean }
                              status: { type: string, enum: [active, inactive, expired] }
                              productName: { type: string }
                              expiresAt: { type: string, format: date-time }

  /api/trpc/profile.get:
    get:
      tags: [tRPC - profile]
      summary: profile.get (query, protected)
      description: Recupera o perfil de hidratação do usuário logado, ou `null`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TrpcInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            oneOf:
                              - $ref: "#/components/schemas/HydrationProfile"
                              - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/trpc/profile.upsert:
    post:
      tags: [tRPC - profile]
      summary: profile.upsert (mutation, protected)
      description: |
        Cria ou atualiza o perfil. Calcula `dailyGoalMl` (≈ 35 ml/kg com ajustes de
        atividade, clima, gestação e lactação) e gera `strategy` — slots horários
        distribuídos ao longo do dia.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HydrationProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            type: object
                            properties:
                              dailyGoalMl: { type: integer }
                              strategy:
                                type: array
                                items: { $ref: "#/components/schemas/HydrationSlot" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/trpc/profile.toggleReminders:
    post:
      tags: [tRPC - profile]
      summary: profile.toggleReminders (mutation, protected)
      description: Alterna o estado de pausa dos lembretes.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            type: object
                            properties:
                              paused: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/trpc/profile.reset:
    post:
      tags: [tRPC - profile]
      summary: profile.reset (mutation, protected)
      description: Apaga o perfil e todos os registros de ingestão do usuário.
      security:
        - sessionCookie: []
      responses:
        "200": { $ref: "#/components/responses/SuccessTrue" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/trpc/intake.getByDate:
    get:
      tags: [tRPC - intake]
      summary: intake.getByDate (query, protected)
      description: Lista os registros de ingestão de uma data (`YYYY-MM-DD`).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TrpcInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            type: array
                            items: { $ref: "#/components/schemas/IntakeRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/trpc/intake.complete:
    post:
      tags: [tRPC - intake]
      summary: intake.complete (mutation, protected)
      description: Marca um slot da estratégia como concluído.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, slotIndex, amountMl]
              properties:
                date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
                slotIndex: { type: integer, minimum: 0 }
                amountMl: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/SuccessTrue" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/trpc/intake.undo:
    post:
      tags: [tRPC - intake]
      summary: intake.undo (mutation, protected)
      description: Remove um registro de ingestão pelo `id`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/SuccessTrue" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/trpc/history.getSummaries:
    get:
      tags: [tRPC - history]
      summary: history.getSummaries (query, protected)
      description: Resumos diários (meta, consumido, % atingida) em um período.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/TrpcInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TrpcResult"
                  - properties:
                      result:
                        properties:
                          data:
                            type: array
                            items: { $ref: "#/components/schemas/DailySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __session_aqua
  parameters:
    TrpcInput:
      in: query
      name: input
      schema: { type: string }
      description: Input do procedure serializado como JSON URL-encoded (tRPC v10).
  responses:
    BadRequest:
      description: Parâmetros inválidos.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Não autenticado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Requer role de admin.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Erro interno.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WebhookOk:
      description: Evento aceito (processado ou ignorado).
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              message: { type: string, example: Ignorado }
    SuccessTrue:
      description: Operação executada com sucesso.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/TrpcResult"
              - properties:
                  result:
                    properties:
                      data:
                        type: object
                        properties:
                          success: { type: boolean, example: true }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    User:
      type: object
      required: [id, openId, role, createdAt, updatedAt, lastSignedIn]
      properties:
        id: { type: integer }
        openId: { type: string }
        name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        loginMethod: { type: string, nullable: true }
        role: { type: string, enum: [user, admin] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastSignedIn: { type: string, format: date-time }
    TrpcResult:
      type: object
      description: Envelope de sucesso tRPC v10.
      properties:
        result:
          type: object
          properties:
            data: {}
    GuruWebhookPayload:
      type: object
      required: [api_token]
      properties:
        api_token: { type: string }
        id: { type: string }
        event: { type: string }
        status: { type: string }
        contact:
          type: object
          properties:
            email: { type: string, format: email }
            name: { type: string }
        buyer:
          type: object
          properties:
            email: { type: string, format: email }
            name: { type: string }
        product:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
    HydrationSlot:
      type: object
      required: [time, amountMl, label, type]
      properties:
        time: { type: string, example: "07:30", description: "HH:mm" }
        amountMl: { type: integer, example: 250 }
        label: { type: string, example: "Ao acordar" }
        type:
          type: string
          enum: [wake_up, pre_meal, pre_workout, post_workout, hydration, last]
    HydrationProfileInput:
      type: object
      required:
        [weight, activityLevel, climate, isPregnant, isLactating, wakeUpTime,
         sleepTime, mealCount, mealTimes, hasWorkout, cupType, cupSizeMl]
      properties:
        weight: { type: integer, minimum: 20, maximum: 300 }
        activityLevel: { type: string, enum: [sedentary, light, moderate, intense] }
        climate: { type: string, enum: [cold, temperate, hot] }
        isPregnant: { type: boolean }
        isLactating: { type: boolean }
        wakeUpTime: { type: string, pattern: '^\d{2}:\d{2}$' }
        sleepTime: { type: string, pattern: '^\d{2}:\d{2}$' }
        mealCount: { type: integer, minimum: 1, maximum: 8 }
        mealTimes:
          type: array
          items: { type: string, pattern: '^\d{2}:\d{2}$' }
        hasWorkout: { type: boolean }
        workoutTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          nullable: true
        cupType: { type: string, minLength: 1, default: large_glass }
        cupSizeMl: { type: integer, minimum: 50, maximum: 2000, default: 300 }
    HydrationProfile:
      allOf:
        - $ref: "#/components/schemas/HydrationProfileInput"
        - type: object
          properties:
            id: { type: integer }
            userId: { type: integer }
            dailyGoalMl: { type: integer }
            strategy:
              type: array
              items: { $ref: "#/components/schemas/HydrationSlot" }
            remindersPaused: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    IntakeRecord:
      type: object
      required: [id, userId, date, slotIndex, amountMl, completedAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        slotIndex: { type: integer }
        amountMl: { type: integer }
        completedAt: { type: string, format: date-time }
    DailySummary:
      type: object
      required: [date, goalMl, consumedMl, percentage, completedSlots, totalSlots]
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        goalMl: { type: integer }
        consumedMl: { type: integer }
        percentage: { type: integer, minimum: 0, maximum: 100 }
        completedSlots: { type: integer }
        totalSlots: { type: integer }
